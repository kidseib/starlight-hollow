name: Windows beta

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that receives the ZIP
        required: true
        default: v0.1.3-beta.1

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned dependency lockfile
        shell: pwsh
        run: |
          $parts = Get-ChildItem .github/lock-parts/*.txt | Sort-Object Name
          $encoded = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('package-lock.json', [Convert]::FromBase64String($encoded))
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run save, market and sign regression tests
        run: node --test tests/save.test.js tests/shop.test.js tests/station-recovery.test.js
      - name: Build portable game, installer, and ZIP
        run: npm run build:windows
      - name: Verify ZIP contents and integrity
        shell: pwsh
        run: |
          $zip = 'artifacts/Starlight-Hollow-Windows-x64.zip'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $actual = @($archive.Entries | ForEach-Object FullName | Sort-Object)
            $expected = @('START-HERE.txt', 'Starlight-Hollow-Portable.exe', 'Starlight-Hollow-Setup.exe')
            if (Compare-Object $actual $expected) { throw "Unexpected ZIP entries: $actual" }
            foreach ($entry in $archive.Entries) {
              $stream = $entry.Open()
              try {
                $buffer = New-Object byte[] 1048576
                while ($stream.Read($buffer, 0, $buffer.Length) -gt 0) {}
              } finally { $stream.Dispose() }
            }
          } finally { $archive.Dispose() }
          Get-FileHash $zip -Algorithm SHA256 | Format-List
      - name: Attach ZIP to existing beta draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" artifacts/Starlight-Hollow-Windows-x64.zip --clobber

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned dependency lockfile
        run: |
          python3 - <<'PY'
          import base64, pathlib
          parts = sorted(pathlib.Path('.github/lock-parts').glob('*.txt'))
          encoded = ''.join(p.read_text().strip() for p in parts)
          pathlib.Path('package-lock.json').write_bytes(base64.b64decode(encoded))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - name: Build web bundle and sync Android shell
        run: |
          npm run build
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Attach APK to existing beta draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" android/app/build/outputs/apk/debug/app-debug.apk#Starlight-Hollow-Android-beta.apk --clobber
